services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: haiku_db
      MYSQL_USER: haiku_user
      MYSQL_PASSWORD: local_haiku_example_2026
      MYSQL_ROOT_PASSWORD: local_root_example_2026
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - haiku_local_mysql:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  haiku_local_mysql:
